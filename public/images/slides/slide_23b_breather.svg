<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <pattern id="grid23" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2DD4BF" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#1a1a2e"/>
  <rect width="960" height="540" fill="url(#grid23)"/>
  <!-- Magnifying glass pixel art (detailed) -->
  <g transform="translate(350,80)" fill="#2DD4BF">
    <!-- Lens ring -->
    <rect x="60" y="0" width="80" height="20"/>
    <rect x="40" y="20" width="20" height="20"/>
    <rect x="140" y="20" width="20" height="20"/>
    <rect x="20" y="40" width="20" height="20"/>
    <rect x="160" y="40" width="20" height="20"/>
    <rect x="20" y="60" width="20" height="20"/>
    <rect x="160" y="60" width="20" height="20"/>
    <rect x="20" y="80" width="20" height="20"/>
    <rect x="160" y="80" width="20" height="20"/>
    <rect x="20" y="100" width="20" height="20"/>
    <rect x="160" y="100" width="20" height="20"/>
    <rect x="40" y="120" width="20" height="20"/>
    <rect x="140" y="120" width="20" height="20"/>
    <rect x="60" y="140" width="80" height="20"/>
    <!-- Handle -->
    <rect x="160" y="120" width="20" height="20"/>
    <rect x="180" y="140" width="20" height="20"/>
    <rect x="200" y="160" width="20" height="20"/>
    <rect x="220" y="180" width="20" height="20"/>
    <rect x="240" y="200" width="20" height="20"/>
    <!-- Glint inside lens -->
    <rect x="60" y="40" width="20" height="20" opacity="0.3"/>
    <rect x="80" y="20" width="20" height="20" opacity="0.2"/>
  </g>
  <!-- JSON documents below magnifying glass -->
  <!-- Doc 1 — matched, glowing teal edge -->
  <g transform="translate(120,320)">
    <rect x="0" y="0" width="160" height="120" fill="#282A36" stroke="#2DD4BF" stroke-width="3" rx="3"/>
    <text x="12" y="25" fill="#2DD4BF" font-family="monospace" font-size="11">{ "title": "..."</text>
    <text x="12" y="45" fill="#2DD4BF" font-family="monospace" font-size="11">  "match": true</text>
    <text x="12" y="65" fill="#FF6B6B" font-family="monospace" font-size="11">  _score: 15.7</text>
    <rect x="12" y="80" width="80" height="8" fill="#2DD4BF" opacity="0.3" rx="1"/>
    <rect x="12" y="95" width="60" height="8" fill="#2DD4BF" opacity="0.2" rx="1"/>
  </g>
  <!-- Doc 2 — matched, teal edge -->
  <g transform="translate(320,340)">
    <rect x="0" y="0" width="140" height="110" fill="#282A36" stroke="#2DD4BF" stroke-width="2" rx="3"/>
    <text x="12" y="25" fill="#2DD4BF" font-family="monospace" font-size="10">{ "doc": 2 }</text>
    <rect x="12" y="40" width="70" height="8" fill="#2DD4BF" opacity="0.3" rx="1"/>
    <rect x="12" y="55" width="90" height="8" fill="#2DD4BF" opacity="0.2" rx="1"/>
    <rect x="12" y="70" width="50" height="8" fill="#2DD4BF" opacity="0.15" rx="1"/>
    <text x="12" y="95" fill="#FF6B6B" font-family="monospace" font-size="10">_score: 8.2</text>
  </g>
  <!-- Doc 3 — matched faintly -->
  <g transform="translate(500,330)">
    <rect x="0" y="0" width="130" height="100" fill="#282A36" stroke="#2DD4BF" stroke-width="1" opacity="0.6" rx="3"/>
    <rect x="12" y="15" width="80" height="7" fill="#C0C0C0" opacity="0.2" rx="1"/>
    <rect x="12" y="30" width="60" height="7" fill="#C0C0C0" opacity="0.15" rx="1"/>
    <rect x="12" y="45" width="90" height="7" fill="#C0C0C0" opacity="0.1" rx="1"/>
    <text x="12" y="80" fill="#FF6B6B" font-family="monospace" font-size="10" opacity="0.5">_score: 3.1</text>
  </g>
  <!-- Doc 4 — unmatched, grey -->
  <g transform="translate(680,350)">
    <rect x="0" y="0" width="120" height="90" fill="#282A36" stroke="#808080" stroke-width="1" opacity="0.3" rx="3"/>
    <rect x="12" y="15" width="70" height="7" fill="#C0C0C0" opacity="0.1" rx="1"/>
    <rect x="12" y="30" width="50" height="7" fill="#C0C0C0" opacity="0.08" rx="1"/>
    <rect x="12" y="45" width="80" height="7" fill="#C0C0C0" opacity="0.06" rx="1"/>
  </g>
  <!-- Doc 5 — unmatched, grey -->
  <g transform="translate(840,360)">
    <rect x="0" y="0" width="100" height="80" fill="#282A36" stroke="#808080" stroke-width="1" opacity="0.2" rx="3"/>
    <rect x="10" y="15" width="60" height="6" fill="#C0C0C0" opacity="0.08" rx="1"/>
    <rect x="10" y="28" width="40" height="6" fill="#C0C0C0" opacity="0.06" rx="1"/>
  </g>
</svg>
