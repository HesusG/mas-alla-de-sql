<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <pattern id="grid36" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#6C5CE7" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#1a1a2e"/>
  <rect width="960" height="540" fill="url(#grid36)"/>
  <!-- Input: Gray text blocks (left) -->
  <g transform="translate(80,160)">
    <text x="0" y="0" fill="#C0C0C0" font-family="monospace" font-size="14" opacity="0.7">La comida mexicana</text>
    <text x="0" y="30" fill="#C0C0C0" font-family="monospace" font-size="14" opacity="0.6">es deliciosa y</text>
    <text x="0" y="60" fill="#C0C0C0" font-family="monospace" font-size="14" opacity="0.5">muy variada</text>
    <!-- Text lines as blocks -->
    <rect x="0" y="80" width="180" height="10" fill="#C0C0C0" opacity="0.2" rx="1"/>
    <rect x="0" y="100" width="140" height="10" fill="#C0C0C0" opacity="0.15" rx="1"/>
    <rect x="0" y="120" width="160" height="10" fill="#C0C0C0" opacity="0.1" rx="1"/>
  </g>
  <!-- Pixel-art retro computer/processor (center) -->
  <g transform="translate(360,120)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="240" height="180" fill="#C0C0C0" stroke="#808080" stroke-width="3" rx="4"/>
    <rect x="0" y="0" width="240" height="22" fill="#C0C0C0"/>
    <rect x="8" y="5" width="12" height="12" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="120" y="16" text-anchor="middle" fill="#000" font-family="monospace" font-size="10" font-weight="bold">analyzer</text>
    <!-- Screen -->
    <rect x="10" y="28" width="220" height="140" fill="#282A36" rx="2"/>
    <!-- Processing visualization inside screen -->
    <text x="25" y="55" fill="#2DD4BF" font-family="monospace" font-size="10">tokenize("comida")</text>
    <text x="25" y="75" fill="#FF6B6B" font-family="monospace" font-size="10">stem("mexican") → "mexic"</text>
    <text x="25" y="95" fill="#6C5CE7" font-family="monospace" font-size="10">embed([0.2, 0.8, ...])</text>
    <!-- Progress bar -->
    <rect x="25" y="115" width="180" height="8" fill="#808080" opacity="0.3" rx="2"/>
    <rect x="25" y="115" width="140" height="8" fill="#2DD4BF" opacity="0.6" rx="2"/>
    <!-- Blinking cursor -->
    <rect x="25" y="135" width="8" height="14" fill="#2DD4BF" opacity="0.8"/>
    <!-- Stand -->
    <rect x="90" y="180" width="60" height="20" fill="#808080"/>
    <rect x="70" y="200" width="100" height="10" fill="#808080" rx="2"/>
  </g>
  <!-- Arrow from text to processor -->
  <g fill="#2DD4BF" opacity="0.6">
    <rect x="290" y="210" width="60" height="4"/>
    <rect x="340" y="204" width="4" height="16"/>
    <rect x="344" y="208" width="4" height="8"/>
  </g>
  <!-- Arrow from processor to output -->
  <g fill="#6C5CE7" opacity="0.6">
    <rect x="610" y="210" width="60" height="4"/>
    <rect x="660" y="204" width="4" height="16"/>
    <rect x="664" y="208" width="4" height="8"/>
  </g>
  <!-- Output: Colored vector constellation (right) -->
  <g transform="translate(700,120)">
    <!-- Vector dots with connections -->
    <circle cx="60" cy="60" r="12" fill="#6C5CE7" opacity="0.8"/>
    <circle cx="120" cy="30" r="10" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="140" cy="100" r="11" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="40" cy="130" r="9" fill="#2DD4BF" opacity="0.6"/>
    <circle cx="160" cy="160" r="8" fill="#6C5CE7" opacity="0.6"/>
    <circle cx="80" cy="180" r="10" fill="#FF6B6B" opacity="0.5"/>
    <circle cx="180" cy="60" r="7" fill="#2DD4BF" opacity="0.5"/>
    <!-- Connecting lines -->
    <line x1="60" y1="60" x2="120" y2="30" stroke="#C0C0C0" stroke-width="1" opacity="0.2"/>
    <line x1="60" y1="60" x2="140" y2="100" stroke="#C0C0C0" stroke-width="1" opacity="0.2"/>
    <line x1="60" y1="60" x2="40" y2="130" stroke="#C0C0C0" stroke-width="1" opacity="0.15"/>
    <line x1="140" y1="100" x2="160" y2="160" stroke="#C0C0C0" stroke-width="1" opacity="0.15"/>
    <line x1="120" y1="30" x2="180" y2="60" stroke="#C0C0C0" stroke-width="1" opacity="0.1"/>
    <!-- Labels -->
    <text x="60" y="55" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8">0.82</text>
    <text x="120" y="25" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8">0.21</text>
    <text x="140" y="95" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8">0.67</text>
  </g>
  <!-- Bottom labels -->
  <text x="170" y="420" text-anchor="middle" fill="#C0C0C0" font-family="monospace" font-size="12" opacity="0.5">texto</text>
  <text x="480" y="420" text-anchor="middle" fill="#C0C0C0" font-family="monospace" font-size="12" opacity="0.5">procesamiento</text>
  <text x="800" y="420" text-anchor="middle" fill="#C0C0C0" font-family="monospace" font-size="12" opacity="0.5">vectores</text>
</svg>
