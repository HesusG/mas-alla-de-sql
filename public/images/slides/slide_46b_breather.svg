<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <pattern id="grid46" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#6C5CE7" stroke-width="0.3" opacity="0.25"/>
    </pattern>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="#1a1a2e"/>
  <rect width="960" height="540" fill="url(#grid46)"/>
  <!-- Coordinate axes (subtle) -->
  <line x1="80" y1="270" x2="880" y2="270" stroke="#C0C0C0" stroke-width="1" opacity="0.15"/>
  <line x1="480" y1="40" x2="480" y2="500" stroke="#C0C0C0" stroke-width="1" opacity="0.15"/>
  <!-- Word cluster 1: Food (top-left) — teal -->
  <g fill="#2DD4BF">
    <circle cx="200" cy="150" r="8" opacity="0.8"/>
    <circle cx="240" cy="170" r="6" opacity="0.6"/>
    <circle cx="180" cy="185" r="7" opacity="0.7"/>
    <circle cx="220" cy="130" r="5" opacity="0.5"/>
  </g>
  <text x="210" y="220" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="13" opacity="0.8">comida</text>
  <text x="245" y="195" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="10" opacity="0.5">tacos</text>
  <text x="178" y="210" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="10" opacity="0.5">cocina</text>
  <!-- Word cluster 2: Tech (top-right) — purple -->
  <g fill="#6C5CE7">
    <circle cx="700" cy="130" r="8" opacity="0.8"/>
    <circle cx="740" cy="155" r="6" opacity="0.6"/>
    <circle cx="680" cy="160" r="7" opacity="0.7"/>
    <circle cx="720" cy="110" r="5" opacity="0.5"/>
  </g>
  <text x="710" y="195" text-anchor="middle" fill="#6C5CE7" font-family="monospace" font-size="13" opacity="0.8">Python</text>
  <text x="745" y="175" text-anchor="middle" fill="#6C5CE7" font-family="monospace" font-size="10" opacity="0.5">datos</text>
  <text x="675" y="185" text-anchor="middle" fill="#6C5CE7" font-family="monospace" font-size="10" opacity="0.5">codigo</text>
  <!-- Word cluster 3: Emotions (bottom-center) — coral -->
  <g fill="#FF6B6B">
    <circle cx="450" cy="370" r="8" opacity="0.8"/>
    <circle cx="490" cy="390" r="6" opacity="0.6"/>
    <circle cx="430" cy="400" r="7" opacity="0.7"/>
    <circle cx="470" cy="350" r="5" opacity="0.5"/>
  </g>
  <text x="460" y="435" text-anchor="middle" fill="#FF6B6B" font-family="monospace" font-size="13" opacity="0.8">alegria</text>
  <text x="495" y="415" text-anchor="middle" fill="#FF6B6B" font-family="monospace" font-size="10" opacity="0.5">feliz</text>
  <text x="425" y="425" text-anchor="middle" fill="#FF6B6B" font-family="monospace" font-size="10" opacity="0.5">amor</text>
  <!-- Isolated word far away -->
  <circle cx="800" cy="430" r="5" fill="#C0C0C0" opacity="0.4"/>
  <text x="800" y="455" text-anchor="middle" fill="#C0C0C0" font-family="monospace" font-size="10" opacity="0.4">automovil</text>
  <!-- Background stars -->
  <circle cx="120" cy="80" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="60" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="600" cy="90" r="2" fill="#fff" opacity="0.25"/>
  <circle cx="850" cy="70" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="150" cy="460" r="2" fill="#fff" opacity="0.2"/>
  <circle cx="300" cy="300" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="750" cy="300" r="2" fill="#fff" opacity="0.2"/>
  <circle cx="550" cy="470" r="1.5" fill="#fff" opacity="0.15"/>
  <!-- Faint connecting lines within clusters -->
  <line x1="200" y1="150" x2="240" y2="170" stroke="#2DD4BF" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="150" x2="180" y2="185" stroke="#2DD4BF" stroke-width="1" opacity="0.2"/>
  <line x1="700" y1="130" x2="740" y2="155" stroke="#6C5CE7" stroke-width="1" opacity="0.2"/>
  <line x1="700" y1="130" x2="680" y2="160" stroke="#6C5CE7" stroke-width="1" opacity="0.2"/>
  <line x1="450" y1="370" x2="490" y2="390" stroke="#FF6B6B" stroke-width="1" opacity="0.2"/>
  <line x1="450" y1="370" x2="430" y2="400" stroke="#FF6B6B" stroke-width="1" opacity="0.2"/>
</svg>
