<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <pattern id="grid17" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2DD4BF" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <linearGradient id="glow17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#1a1a2e"/>
  <rect width="960" height="540" fill="url(#grid17)"/>
  <!-- SQL box on left -->
  <g transform="translate(160,140)">
    <rect x="0" y="0" width="200" height="260" fill="#282A36" stroke="#808080" stroke-width="3"/>
    <rect x="0" y="0" width="200" height="24" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <rect x="8" y="6" width="12" height="12" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="100" y="17" text-anchor="middle" fill="#000" font-family="monospace" font-size="11" font-weight="bold">tables.sql</text>
    <!-- Table rows inside -->
    <rect x="20" y="50" width="160" height="12" fill="#C0C0C0" opacity="0.3" rx="1"/>
    <rect x="20" y="70" width="160" height="12" fill="#C0C0C0" opacity="0.25" rx="1"/>
    <rect x="20" y="90" width="160" height="12" fill="#C0C0C0" opacity="0.2" rx="1"/>
    <rect x="20" y="110" width="160" height="12" fill="#C0C0C0" opacity="0.15" rx="1"/>
    <rect x="20" y="130" width="160" height="12" fill="#C0C0C0" opacity="0.1" rx="1"/>
    <!-- Column dividers -->
    <line x1="70" y1="40" x2="70" y2="150" stroke="#C0C0C0" stroke-width="1" opacity="0.2"/>
    <line x1="130" y1="40" x2="130" y2="150" stroke="#C0C0C0" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Door frame opening to the right -->
  <g transform="translate(410,120)">
    <!-- Door frame -->
    <rect x="0" y="0" width="140" height="300" fill="none" stroke="#C0C0C0" stroke-width="6"/>
    <!-- Door (slightly open, perspective) -->
    <polygon points="10,10 70,30 70,270 10,290" fill="#808080" opacity="0.4"/>
    <!-- Glowing light through opening -->
    <rect x="70" y="10" width="60" height="280" fill="url(#glow17)" opacity="0.6"/>
    <!-- Door handle -->
    <rect x="55" y="145" width="8" height="16" fill="#2DD4BF" rx="2"/>
  </g>
  <!-- Vast landscape beyond — multiple paths -->
  <g transform="translate(560,100)">
    <!-- Horizon glow -->
    <ellipse cx="200" cy="320" rx="260" ry="40" fill="#2DD4BF" opacity="0.15"/>
    <!-- Path 1: ES (coral) -->
    <g fill="#FF6B6B" opacity="0.7">
      <rect x="60" y="200" width="20" height="20"/>
      <rect x="40" y="220" width="20" height="20"/>
      <rect x="20" y="240" width="20" height="20"/>
      <rect x="0" y="260" width="20" height="20"/>
    </g>
    <!-- Path 2: Vector DB (purple) -->
    <g fill="#6C5CE7" opacity="0.7">
      <rect x="180" y="180" width="20" height="20"/>
      <rect x="200" y="200" width="20" height="20"/>
      <rect x="220" y="220" width="20" height="20"/>
      <rect x="240" y="240" width="20" height="20"/>
    </g>
    <!-- Path 3: Graph (teal) -->
    <g fill="#2DD4BF" opacity="0.7">
      <rect x="120" y="160" width="20" height="20"/>
      <rect x="120" y="180" width="20" height="20"/>
      <rect x="120" y="200" width="20" height="20"/>
      <rect x="120" y="220" width="20" height="20"/>
    </g>
    <!-- Stars/dots in the sky -->
    <circle cx="40" cy="40" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="150" cy="20" r="2" fill="#fff" opacity="0.4"/>
    <circle cx="260" cy="60" r="3" fill="#2DD4BF" opacity="0.5"/>
    <circle cx="100" cy="80" r="2" fill="#fff" opacity="0.3"/>
    <circle cx="300" cy="30" r="2" fill="#6C5CE7" opacity="0.5"/>
    <circle cx="200" cy="100" r="3" fill="#FF6B6B" opacity="0.4"/>
    <circle cx="50" cy="120" r="2" fill="#2DD4BF" opacity="0.4"/>
    <circle cx="330" cy="100" r="2" fill="#fff" opacity="0.3"/>
    <!-- Teal horizon line -->
    <line x1="-20" y1="300" x2="380" y2="300" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
